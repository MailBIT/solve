<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Solve &amp; Evolve</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b2248; overflow: hidden; touch-action: none; }
    /* The game is designed at 16:9: show it as large as fits, centred, never cropped. */
    #frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
             width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #dff5ff; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              font: bold 28px Trebuchet MS, system-ui, sans-serif; color: #fff; gap: 18px; }
    #bar { width: 50%; height: 18px; border-radius: 9px; background: #12356b; border: 3px solid #f5b21a; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #f5b21a; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader"><div>Solve &amp; Evolve</div><div id="bar"><div id="fill"></div></div></div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Family",
      productName: "Solve _ Evolve",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js";
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.querySelector("#loader").remove();
      }).catch(function (message) {
        document.querySelector("#loader").textContent = "Sorry, the game could not start: " + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
